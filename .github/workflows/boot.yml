name: boot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot server
        run: |
          set +e
          mkdir -p run
          echo "eula=true" > run/eula.txt
          timeout 540 ./gradlew --no-daemon runServer < <(sleep 240; echo stop; sleep 60) > boot.log 2>&1
          echo "exit=$?" >> boot.log
          grep -nE "Done \(|FAILED|Mixin|ERROR|Exception|WARN.*mekanism|mekanism" boot.log | head -80 > boot-summary.txt || true
          tail -40 boot.log
      - name: Publicar
        run: |
          git config user.name ci; git config user.email ci@x
          git checkout --orphan ci-boot
          git rm -rf -q --cached . >/dev/null
          git add -f boot.log boot-summary.txt
          git commit -qm "boot" && git push -f origin ci-boot
