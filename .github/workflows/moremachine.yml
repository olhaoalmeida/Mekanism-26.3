name: moremachine
on: workflow_dispatch
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - name: build Mekanism
        run: ./gradlew assemble --no-daemon --console=plain > mek.log 2>&1 || (tail -50 mek.log; exit 1)
      - name: build MoreMachine
        working-directory: addons/moremachine
        run: chmod +x gradlew && ./gradlew build -x spotlessCheck -x spotlessApply --no-daemon --continue --console=plain > ../../mm.log 2>&1 || echo FAILED > ../../failed.flag
      - name: publish log
        if: always()
        run: |
          mkdir -p out && cp mm.log out/ || true
          grep -E "error:|FAILED|BUILD|What went wrong" -A2 mm.log | head -400 > out/errors.txt || true
          grep -c "error:" mm.log > out/count.txt || true
          find addons/moremachine/build -name '*.jar' > out/jars.txt || true
          cd out && git init -q && git checkout -q -b ci-mm && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm log && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ci-mm
