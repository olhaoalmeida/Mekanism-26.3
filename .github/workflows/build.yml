name: build
on: workflow_dispatch
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - name: assemble
        run: ./gradlew assemble --no-daemon --continue --console=plain > build.log 2>&1 || echo FAILED > failed.flag
      - name: publish log
        if: always()
        run: |
          mkdir -p out && cp build.log out/
          grep -E "error:|FAILED|BUILD" build.log > out/errors.txt || true
          find . -path ./out -prune -o -name '*.jar' -path '*build/libs*' -print > out/jars.txt || true
          cd out && git init -q && git checkout -q -b ci-build && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm log && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ci-build
