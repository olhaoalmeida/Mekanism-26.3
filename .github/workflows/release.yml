name: release
on: workflow_dispatch
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assemble --no-daemon --console=plain
      - name: create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="v10.8.0-26.3-r${{ github.run_number }}"
          gh release create "$tag" --prerelease --title "Mekanism 10.8.0 (MC 26.3) r${{ github.run_number }}" \
            --notes "Mekanism 10.8.0 para NeoForge 26.3 (branch oficial 26.3) com os addons oficiais Generators, Tools e Additions, cada um em seu jar. Testado: compila, servidor sobe e cliente entra no mundo (CI headless). Não testado jogando." \
            build/libs/Mekanism-26.3-10.8.0.homebaked.jar build/libs/MekanismGenerators-26.3-10.8.0.homebaked.jar build/libs/MekanismTools-26.3-10.8.0.homebaked.jar build/libs/MekanismAdditions-26.3-10.8.0.homebaked.jar
