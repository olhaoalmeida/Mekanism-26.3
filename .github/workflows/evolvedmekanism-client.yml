name: evolvedmekanism-client
on: workflow_dispatch
permissions: { contents: write }
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libgl1 libglu1-mesa xserver-xorg-core libegl1 libegl-mesa0 libgbm1 libgles2 libopenal1 x11-utils libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1 > /dev/null
      - name: build Mekanism
        run: ./gradlew assemble --no-daemon --console=plain > mek.log 2>&1 || (tail -50 mek.log; exit 1)
      - name: Prepare world with server
        working-directory: addons/evolvedmekanism
        run: |
          set +e
          chmod +x gradlew
          mkdir -p run/server && echo "eula=true" > run/server/eula.txt
          rm -f in.fifo; mkfifo in.fifo
          (timeout 600 ./gradlew runServer --no-daemon --console=plain -x spotlessCheck -x spotlessApply < in.fifo > ../../server.log 2>&1) &
          exec 3>in.fifo
          for i in $(seq 1 120); do sleep 4; if grep -qE "Done \(|BUILD FAILED" ../../server.log; then break; fi; done
          sleep 15; echo stop >&3; sleep 30; pkill -f runServer || true
          mkdir -p run/Client/saves && cp -r run/server/world-extra run/Client/saves/world-extra
          ls run/Client/saves/world-extra | head
      - name: Client options and quickplay
        working-directory: addons/evolvedmekanism
        run: |
          printf "menuBackgroundBlurriness:0\nrenderDistance:2\nsimulationDistance:5\nmaxFps:20\nvsync:false\nsoundCategory_master:0.0\nnarrator:0\nparticles:0\nbiomeBlendRadius:0\nmipmapLevels:0\nentityShadows:false\n" > run/Client/options.txt
          sed -i "s|gameDirectory.set(file('run/Client'))|gameDirectory.set(file('run/Client'))\n            programArguments.addAll('--width','320','--height','200','--quickPlaySingleplayer','world-extra')|" gradle/scripts/moddevgradle.gradle
          grep -n "quickPlaySingleplayer" gradle/scripts/moddevgradle.gradle
      - name: Run client
        timeout-minutes: 22
        working-directory: addons/evolvedmekanism
        run: |
          set +e
          export SDL_VIDEODRIVER=offscreen SDL_VIDEO_EGL_DRIVER=libEGL.so.1 GALLIUM_DRIVER=llvmpipe LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450
          Xvfb :99 -ac -screen 0 1280x720x24 +extension GLX +extension RANDR +render -noreset &
          XVFB=$!
          export DISPLAY=:99
          sleep 3
          (sleep 420; pkill -f net.minecraft) &
          timeout 700 ./gradlew --no-daemon runClient -x spotlessCheck -x spotlessApply > ../../client.log 2>&1
          echo "exit=$?" >> ../../client.log
          kill $XVFB || true
          grep -nE "Mixin|FAILED|Exception|ERROR|Reloading|Stopping|Saving|Joined|logged in|Loaded .* models|mekmm" ../../client.log | head -200 > ../../client-summary.txt || true
          tail -40 ../../client.log
      - name: Publicar
        if: always()
        run: |
          mkdir -p out && cp client.log client-summary.txt server.log out/ 2>/dev/null || true
          cd out && git init -q && git checkout -q -b ci-evoclient && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm log && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ci-evoclient
