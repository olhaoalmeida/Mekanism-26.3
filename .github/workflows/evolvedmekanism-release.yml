name: evolvedmekanism-release
on: workflow_dispatch
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assemble --no-daemon --console=plain
      - name: build EvolvedMekanism
        working-directory: addons/evolvedmekanism
        run: chmod +x gradlew && ./gradlew jar -x spotlessCheck -x spotlessApply --no-daemon --console=plain
      - name: create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="evolvedmekanism-v2.0.0-26.3-r${{ github.run_number }}"
          gh release create "$tag" --prerelease --title "Evolved Mekanism 1.3.0 (MC 26.3 / Mekanism 10.8) r${{ github.run_number }}" \
            --notes "Port do Evolved Mekanism (iglee42, MIT) para NeoForge 26.3 / Mekanism 10.8. Requer o Mekanism 10.8 desta repo. Testado apenas no CI headless; NÃO testado jogando." \
            addons/evolvedmekanism/build/libs/evolvedmekanism-1.3.0-26.3.jar
